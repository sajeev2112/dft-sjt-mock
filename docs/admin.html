<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DFT SJT Site Dashboard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.dash{display:grid; gap:18px}
.dhead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; justify-content:space-between}
.dmeta{font-size:13px; color:var(--ink-3)}
.login{max-width:420px; display:grid; gap:12px}
.login input[type=password]{font:15px var(--sans); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); width:100%}
.login input:focus{outline:2px solid var(--accent); outline-offset:1px}
.err{color:var(--bad); font-size:13.5px; margin:0}
.tiles6{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px}
.tile .sub2{font-size:12px; color:var(--ink-3)}
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.filters .seg{grid-template-columns:repeat(3, auto)}
.charts{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.chartcard{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0}
.chartcard h3{margin:0 0 2px; font:600 15px var(--sans)}
.chartcard .cap{margin:0 0 10px; font-size:12.5px; color:var(--ink-3)}
.chartcard svg{width:100%; height:auto; display:block; overflow:visible}
.chartcard .gl{stroke:var(--line); stroke-width:1}
.chartcard .ax{fill:var(--ink-3); font:500 11px var(--mono)}
.chartcard .area{fill:var(--accent-soft); opacity:.75}
.chartcard .ln{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chartcard .bar{fill:var(--accent)}
.chartcard .bar.hot{fill:var(--ink)}
.chartcard .pt{fill:var(--accent); stroke:var(--surface); stroke-width:2}
.chartcard .xh{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3}
.chartcard .hit{fill:transparent; cursor:crosshair}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--ground); font:500 12px/1.4 var(--sans); padding:7px 9px; border-radius:7px; white-space:nowrap; transform:translate(-50%, -110%); box-shadow:var(--shadow)}
.tip b{font-family:var(--mono)}
.datatoggle{font-size:12.5px; margin-top:8px}
.datatoggle summary{cursor:pointer; color:var(--accent)}
.flag{font:600 11.5px var(--mono); padding:3px 8px; border-radius:999px; white-space:nowrap}
.flag.recheck{background:var(--bad-soft); color:var(--bad)}
.flag.watch{background:var(--near-soft); color:var(--near)}
.flag.ok{background:var(--good-soft); color:var(--good)}
.flag.few{background:var(--surface-2); color:var(--ink-3)}
.qrow{cursor:pointer}
.qrow:hover td{background:var(--surface-2)}
.qrow td:first-child{white-space:nowrap}
.qdetail td{background:var(--surface-2); padding:14px}
.qdetail .scn{font:400 15px/1.5 var(--serif); margin:0 0 10px; max-width:70ch}
.qdetail .optt{width:100%; border-collapse:collapse; font-size:13.5px}
.qdetail .optt td,.qdetail .optt th{padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.qdetail .optt th{font:500 11px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3)}
.minibar{display:inline-block; height:8px; border-radius:4px; background:var(--accent); vertical-align:middle; margin-right:6px}
.comments{display:grid; gap:8px}
.cmt{background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:14px}
.cmt .cm{font:500 12px var(--mono); color:var(--ink-3); margin-bottom:4px}
.empty{color:var(--ink-3); font-size:14px}
@media (max-width:760px){ .charts{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Private · site owner only</p>
      <h1>Site dashboard</h1>
    </div>
    <nav class="views"><a class="btn small" href="./">Back to the practice site</a></nav>
  </header>
  <main id="dash" class="dash" aria-live="polite"></main>
</div>
<script src="questions.js"></script>
<script src="admin.js"></script>
</body>
</html>
